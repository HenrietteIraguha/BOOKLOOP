{% extends "base.html" %}

{% block title %}Log in | BookLoop{% endblock %}

{% block content %}
<div class="card" style="max-width: 400px; margin: 40px auto;">
  <h2>Operator login</h2>

  {% if form.errors %}
    <p class="error">Your username or password is incorrect. Please try again.</p>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <p>
      <label for="id_username">Username</label><br>
      <input type="text" name="username" id="id_username" required autofocus style="width: 100%; padding: 8px;">
    </p>
    <p>
      <label for="id_password">Password</label><br>
      <input type="password" name="password" id="id_password" required style="width: 100%; padding: 8px;">
    </p>
    <button type="submit" style="width: 100%; padding: 10px; background: #2f4f80; color: white;
            border: none; border-radius: 4px; cursor: pointer;">Log in</button>
  </form>
</div>
{% endblock %}
