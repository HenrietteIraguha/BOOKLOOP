<div class="field">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="req">*</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<span class="helptext">{{ field.help_text }}</span>{% endif %}
  {% if field.errors %}<span class="error">{{ field.errors|join:" " }}</span>{% endif %}
</div>
